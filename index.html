<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>k1rseex<3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --glow: 0 0 15px rgba(255, 255, 255, 0.6); }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000 url('https://i.pinimg.com/originals/f4/f4/af/f4f4af726dc651a4565f826aaff3ef6b.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Общий контейнер для адаптации */
        .main-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: var(--glow);
            margin-bottom: 15px;
            object-fit: cover;
        }

        .nick { font-size: 30px; font-weight: 800; text-shadow: 0 0 10px white; margin: 10px 0; }
        .quote { font-size: 14px; color: #aaa; margin-bottom: 25px; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .social-icons a {
            color: white;
            font-size: 24px;
            filter: drop-shadow(0 0 2px white);
            transition: transform 0.2s;
        }
        
        .social-icons a:active { transform: scale(0.8); }

        .view-counter {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Плеер */
        .player-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .track-art {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            background: url('https://i.ibb.co/9HYpWp2p/ProblemNYYrebenok1683103233.jpg') no-repeat center;
            background-size: cover;
            flex-shrink: 0;
        }

        .track-meta { flex-grow: 1; min-width: 0; }
        .track-name {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
            display: block;
        }

        .progress-wrap {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: white;
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 10px white;
        }

        .time-info {
            font-size: 10px;
            color: #777;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
        }

        .player-controls i { cursor: pointer; transition: 0.2s; }
        .player-controls i:active { transform: scale(0.8); }

        /* Блок комментариев */
        .comments-box {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comments-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* Кастомный скроллбар для списка комментов */
        .comments-list::-webkit-scrollbar { width: 4px; }
        .comments-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 2px; }
        .comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

        .comment-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            word-break: break-word;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .comment-author { font-weight: 700; color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .comment-date { color: #666; }
        .comment-text { color: #ccc; line-height: 1.4; }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 8px rgba(255,255,255,0.1);
        }

        .anon-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            user-select: none;
            width: fit-content;
        }

        .anon-wrapper input {
            cursor: pointer;
            accent-color: #fff;
        }

        .submit-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:hover { background: #eee; }
        .submit-btn:active { transform: scale(0.98); }

        /* --- Адаптация для мобильных --- */
        @media (max-width: 480px) {
            .main-wrapper { gap: 0; }
            
            .card {
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                padding-bottom: 30px;
            }

            .player-box {
                border-radius: 0;
                border-top: none;
                background: rgba(15, 15, 15, 0.95);
                padding: 20px;
            }

            .comments-box {
                border-radius: 0;
                border-bottom-left-radius: 24px;
                border-bottom-right-radius: 24px;
                border-top: 1px solid rgba(255,255,255,0.05);
                background: rgba(10, 10, 10, 0.98);
            }

            .avatar { width: 90px; height: 90px; }
            .nick { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- КАРТОЧКА ПРОФИЛЯ -->
        <div class="card">
            <img src="https://i.pinimg.com/originals/c9/a6/c0/c9a6c0dd27f0411498c8091a7680a3d6.gif" class="avatar">
            <div class="nick">k1rseex<3</div>
            <div class="quote">что заставляет вас жить?</div>
            
            <div class="social-icons">
                <a href="https://steamcommunity.com/profiles/76561199514320529/" target="_blank"><i class="fa-brands fa-steam"></i></a>
                <a href="https://t.me/+n_6e8sSttyliNzEy" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://soundcloud.com/k1rseex" target="_blank"><i class="fa-brands fa-soundcloud"></i></a>
                <a href="https://www.twitch.tv/k1rseex" target="_blank"><i class="fa-brands fa-twitch"></i></a>
                <a href="https://discord.gg/w7n8EnkZmn" target="_blank"><i class="fa-brands fa-discord"></i></a>
            </div>

            <div class="view-counter">
                <i class="fa-solid fa-eye"></i> просмотры: <span id="v-count">0</span>
            </div>
        </div>

        <!-- МУЗЫКАЛЬНЫЙ ПЛЕЕР -->
        <div class="player-box">
            <div class="track-art"></div>
            <div class="track-meta">
                <span class="track-name">Поменяю</span>
                <div class="progress-wrap" id="seek-bar">
                    <div class="progress-bar" id="p-line"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span>2:08</span>
                </div>
            </div>
            <div class="player-controls">
                <i class="fa-solid fa-volume-high" id="mute-btn"></i>
                <i class="fa-solid fa-play" id="play-btn"></i>
            </div>
        </div>

        <!-- БЛОК КОММЕНТАРИЕВ -->
        <div class="comments-box">
            <div class="comments-list" id="comments-container">
                <!-- Сюда будут рендериться комментарии -->
            </div>

            <div class="comment-form">
                <input type="text" id="author-input" class="input-field" placeholder="Ваш нейм" maxlength="20">
                
                <label class="anon-wrapper">
                    <input type="checkbox" id="anon-checkbox">
                    <span>Отправить анонимно</span>
                </label>

                <input type="text" id="text-input" class="input-field" placeholder="Ваш коментарий" maxlength="150" required>
                
                <button type="button" id="submit-comment" class="submit-btn">Отправить</button>
            </div>
        </div>
    </div>

    <audio id="audio-track" src="https://files.catbox.moe/4bk2sc.mp3" loop preload="auto" playsinline crossorigin="anonymous"></audio>

    <script>
        // --- Логика плеера и счетчика ---
        const audio = document.getElementById('audio-track');
        const playBtn = document.getElementById('play-btn');
        const muteBtn = document.getElementById('mute-btn');
        const progress = document.getElementById('p-line');
        const seekBar = document.getElementById('seek-bar');
        const timeDisplay = document.getElementById('current-time');
        const viewDisplay = document.getElementById('v-count');

        const durationSeconds = 128;

        try {
            let count = localStorage.getItem('v_count') || 0;
            count++;
            localStorage.setItem('v_count', count);
            viewDisplay.innerText = count;
        } catch(e) { 
            viewDisplay.innerText = "1";
        }

        function togglePlay() {
            if (audio.paused) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playBtn.className = 'fa-solid fa-pause';
                    }).catch(error => {
                        console.log("Автоплей заблокирован.");
                    });
                }
            } else {
                audio.pause();
                playBtn.className = 'fa-solid fa-play';
            }
        }

        playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
        document.addEventListener('click', () => { if (audio.paused) togglePlay(); }, { once: true });

        muteBtn.onclick = (e) => {
            e.stopPropagation();
            audio.muted = !audio.muted;
            muteBtn.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        };

        audio.ontimeupdate = () => {
            const current = audio.currentTime;
            const dur = audio.duration || durationSeconds;
            const pct = (current / dur) * 100;
            progress.style.width = pct + '%';
            
            const mins = Math.floor(current / 60);
            const secs = Math.floor(current % 60);
            timeDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        seekBar.onclick = (e) => {
            const rect = seekBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * (audio.duration || durationSeconds);
        };

        // --- Логика комментариев ---
        const commentsContainer = document.getElementById('comments-container');
        const authorInput = document.getElementById('author-input');
        const anonCheckbox = document.getElementById('anon-checkbox');
        const textInput = document.getElementById('text-input');
        const submitBtn = document.getElementById('submit-comment');

        // Загрузка комментов из памяти
        let comments = JSON.parse(localStorage.getItem('page_comments')) || [
            { author: "Система", text: "Здесь пока пусто. Будь первым! <3", date: "Только что" }
        ];

        // Функция рендера списка
        function renderComments() {
            commentsContainer.innerHTML = '';
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.author)}</span>
                        <span class="comment-date">${c.date}</span>
                    </div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                `;
                commentsContainer.appendChild(item);
            });
            // Скроллим вниз к новому сообщению
            commentsContainer.scrollTop = commentsContainer.scrollHeight;
        }

        // Блокировка/разблокировка инпута имени при галочке анонимности
        anonCheckbox.addEventListener('change', () => {
            if (anonCheckbox.checked) {
                authorInput.value = '';
                authorInput.disabled = true;
                authorInput.style.opacity = '0.5';
                authorInput.placeholder = 'Анонимно';
            } else {
                authorInput.disabled = false;
                authorInput.style.opacity = '1';
                authorInput.placeholder = 'Ваш нейм';
            }
        });

        // Обработка клика "Отправить"
        submitBtn.onclick = (e) => {
            e.stopPropagation(); // Чтобы не срабатывал глобальный клик на плеер
            
            const text = textInput.value.trim();
            if (!text) return;

            let author = authorInput.value.trim();
            if (anonCheckbox.checked || !author) {
                author = "Аноним";
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' ' + now.toLocaleDateString([], {day: '2-digit', month: '2-digit'});

            // Удаляем дефолтный приветственный коммент, если он есть
            if (comments.length === 1 && comments[0].author === "Система") {
                comments = [];
            }

            comments.push({ author, text, date: timeStr });
            localStorage.setItem('page_comments', JSON.stringify(comments));
            
            renderComments();
            
            // Сброс поля ввода сообщения
            textInput.value = '';
        };

        // Защита от XSS тегов
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Инициализация при загрузке
        renderComments();
    </script>
</body>
</html>
